<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#5b3df5">
  <title>ЗДТ</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%23f5a300'/%3E%3Cpath d='M16 7.5l2.1 6.4 6.4 2.1-6.4 2.1L16 24.5l-2.1-6.4L7.5 16l6.4-2.1z' fill='%23fff'/%3E%3C/svg%3E">
  <style>
    :root { --bg: #f3f1fa; --card: #fff; --text: #17142b; --muted: #6e6a86; --accent: #6a4cff; }
    @media (prefers-color-scheme: dark) { :root { --bg: #0e0c1a; --card: #1a1730; --text: #f1effb; --muted: #9e99b8; --accent: #8b74ff; } }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
      background: var(--bg); color: var(--text); font: 500 16px/1.5 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
    main { max-width: 380px; width: 100%; text-align: center; }
    .logo { width: 76px; height: 76px; margin: 0 auto 16px; border-radius: 24px; display: grid; place-items: center;
      background: linear-gradient(140deg, #5b3df5, #d35cff); box-shadow: 0 16px 36px -14px rgba(106,76,255,.7); }
    h1 { margin: 0 0 6px; font-size: 30px; }
    p { color: var(--muted); margin: 8px 0; }
    .spinner { width: 28px; height: 28px; margin: 20px auto; border-radius: 50%; border: 3px solid var(--muted); border-top-color: var(--accent); animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    a.btn, button { display: inline-block; margin-top: 16px; padding: 13px 20px; border: 0; border-radius: 16px; font: inherit; font-weight: 700;
      color: #fff; background: linear-gradient(135deg, #6a4cff, #9b5cff); text-decoration: none; cursor: pointer; }
    a.soft { background: transparent; color: var(--accent); }
  </style>
</head>
<body>
  <main>
    <div class="logo">
      <svg width="44" height="44" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="15" fill="#f5a300"/><path d="M16 7.5l2.1 6.4 6.4 2.1-6.4 2.1L16 24.5l-2.1-6.4L7.5 16l6.4-2.1z" fill="#fff"/></svg>
    </div>
    <h1>ЗДТ</h1>
    <div id="state"><p>Шукаю додаток…</p><div class="spinner"></div></div>
  </main>
  <script>
    // Сервер ЗДТ працює на домашньому ноутбуці. Його поточна адреса (Cloudflare Tunnel)
    // змінюється, тому він записує її у Firebase, а ця сторінка читає й перекидає туди.
    const LINK = 'https://what-homework-default-rtdb.europe-west1.firebasedatabase.app/zdt_link.json';
    const state = document.getElementById('state');

    function show(html) { state.innerHTML = html; }

    function asleep(link) {
      const when = link?.updated ? new Date(link.updated).toLocaleString('uk-UA', { day: 'numeric', month: 'long', hour: '2-digit', minute: '2-digit' }) : null;
      show(`<p><b>Ноутбук з ЗДТ зараз не відповідає.</b></p>
        <p>Мабуть, він вимкнений або спить. Попросіть когось удома його розбудити — і спробуйте ще раз.</p>
        ${when ? `<p style="font-size:14px">Останній запуск: ${when}</p>` : ''}
        <button onclick="location.reload()">Спробувати ще раз</button>
        ${link?.url ? `<br><a class="btn soft" href="${link.url}">Все одно відкрити</a>` : ''}`);
    }

    async function go() {
      let link = null;
      try {
        link = await (await fetch(LINK, { cache: 'no-store' })).json();
      } catch {
        return show('<p>Немає інтернету або Firebase недоступний.</p><button onclick="location.reload()">Спробувати ще раз</button>');
      }
      if (!link?.url || !/^https:\/\/[a-z0-9-]+\.trycloudflare\.com$/.test(link.url)) return asleep(link);
      try {
        const ctrl = new AbortController();
        setTimeout(() => ctrl.abort(), 6000);
        const r = await fetch(`${link.url}/api/ping`, { signal: ctrl.signal, cache: 'no-store' });
        if (!r.ok) throw new Error();
        location.replace(link.url);
      } catch {
        asleep(link);
      }
    }
    go();
  </script>
</body>
</html>
