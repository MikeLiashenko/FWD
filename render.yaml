# Налаштування для безкоштовного хостингу Render (https://render.com): New → Blueprint → цей репозиторій.
# Секрети (sync: false) Render попросить ввести вручну під час створення.
services:
  - type: web
    name: zdt
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/ping
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: ZDT_TRUST_PROXY
        value: "1"
      - key: ZDT_PUBLIC_URL
        value: https://mikeliashenko.github.io/FWD/
      - key: GEMINI_API_KEY
        sync: false
      - key: FIREBASE_DATABASE_URL
        sync: false
      - key: FIREBASE_KEY_JSON
        sync: false
